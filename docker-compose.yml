services:
  cassandra:
    image: cassandra:5.0.9
    environment:
      CASSANDRA_CLUSTER_NAME: url-shortner
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        sed -i 's/^authenticator: AllowAllAuthenticator$/authenticator: PasswordAuthenticator/' /etc/cassandra/cassandra.yaml
        sed -i 's/^authorizer: AllowAllAuthorizer$/authorizer: CassandraAuthorizer/' /etc/cassandra/cassandra.yaml
        exec /usr/local/bin/docker-entrypoint.sh cassandra -f
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -u cassandra -p cassandra -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  cassandra-init:
    image: cassandra:5.0.9
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_USERNAME: ${CASSANDRA_USERNAME:?Set CASSANDRA_USERNAME in your environment or .env file}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD:?Set CASSANDRA_PASSWORD in your environment or .env file}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        cqlsh cassandra 9042 -u cassandra -p cassandra -e "CREATE KEYSPACE IF NOT EXISTS url_shortner WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"
        cqlsh cassandra 9042 -u cassandra -p cassandra -e "CREATE ROLE IF NOT EXISTS $${CASSANDRA_USERNAME} WITH PASSWORD = '$${CASSANDRA_PASSWORD}' AND LOGIN = true;"
        cqlsh cassandra 9042 -u cassandra -p cassandra -e "GRANT ALL PERMISSIONS ON KEYSPACE url_shortner TO $${CASSANDRA_USERNAME};"
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  url-cache-redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      url-cache-redis:
        condition: service_healthy
    environment:
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: url_shortner
      CASSANDRA_USERNAME: ${CASSANDRA_USERNAME:?Set CASSANDRA_USERNAME in your environment or .env file}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD:?Set CASSANDRA_PASSWORD in your environment or .env file}
      REDIS_URL: redis://redis:6379/0
      URL_CACHE_REDIS_URL: redis://url-cache-redis:6379/0
      SHORT_CODE_SECRET_KEY: ${SHORT_CODE_SECRET_KEY:?Set SHORT_CODE_SECRET_KEY in your environment or .env file}
    restart: unless-stopped

  load-balancer:
    image: nginx:stable-alpine
    depends_on:
      - api
    ports:
      - "127.0.0.1:${API_PORT?Set API_PORT in your environment or .env file}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  cassandra_data:
  redis_data:
